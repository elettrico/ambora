name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.name }})
    needs: create-release
    strategy:
      # One platform failing shouldn't cancel the others — a macOS notarization
      # problem doesn't invalidate the Windows or Linux artifacts.
      fail-fast: false
      matrix:
        include:
          # The two macOS architectures build as separate jobs so their
          # notarization submissions queue at Apple in parallel. Building both in
          # one job would serialise them, and the wait is measured in hours.
          # macos-latest is Apple Silicon; electron-builder cross-builds the x64
          # app and signs it there just as happily — but ffmpeg-static downloads
          # for the *host* arch at npm ci, so the x64 job must reinstall it.
          - os: macos-latest
            name: macos-arm64
            script: dist:mac
            args: --arm64
            ffmpeg_arch: arm64
            timeout: 240
          - os: macos-latest
            name: macos-x64
            script: dist:mac
            args: --x64
            ffmpeg_arch: x64
            timeout: 240
          - os: windows-latest
            name: windows
            script: dist:win
            args: ''
            ffmpeg_arch: ''
            timeout: 30
          - os: ubuntu-latest
            name: linux
            script: dist:linux
            args: ''
            ffmpeg_arch: ''
            timeout: 30

    runs-on: ${{ matrix.os }}
    # Bounds a stuck job well below GitHub's 6h default. Generous on macOS
    # because notarization genuinely waits on Apple — v0.5.0's submission took
    # 2h28m, so anything tighter would kill legitimate releases.
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ffmpeg-static's postinstall downloads a binary for the runner's host
      # architecture. When we cross-build macOS x64 on Apple Silicon, that leaves
      # an arm64 helper in node_modules — which electron-builder then packs into
      # the Intel app (verified broken in v0.7.2). Force the target binary here.
      - name: Install target-architecture FFmpeg
        if: matrix.ffmpeg_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_platform=darwin npm_config_arch="${{ matrix.ffmpeg_arch }}" \
            node node_modules/ffmpeg-static/install.js
          info="$(file -b node_modules/ffmpeg-static/ffmpeg)"
          echo "Bundled ffmpeg: $info"
          case "${{ matrix.ffmpeg_arch }}" in
            arm64)
              echo "$info" | grep -q 'arm64' || {
                echo "::error::Expected arm64 ffmpeg, got: $info"
                exit 1
              }
              ;;
            x64)
              echo "$info" | grep -Eq 'x86_64|i386' || {
                echo "::error::Expected x86_64 ffmpeg for macOS x64, got: $info"
                exit 1
              }
              ;;
          esac

      - name: Set version from tag
        shell: bash
        # --allow-same-version so the build doesn't fail when package.json is
        # already at the tag's version (e.g. it was bumped in a merged PR before
        # tagging). Without it, `npm version` errors with "Version not changed".
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Developer ID certificates issued by the G2 sub-CA chain through an
      # intermediate that ships neither with macOS nor in electron-builder's
      # bundled root_certs.keychain. Without it codesign can't build the chain,
      # `security find-identity -v` reports zero valid identities, and signing is
      # silently skipped. Harmless when the runner already has it.
      - name: Install Apple Developer ID G2 intermediate
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cer="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL -o "$cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$cer" -k "$HOME/Library/Keychains/login.keychain-db" \
            || echo "::notice::G2 intermediate already present or not importable; continuing"

      # The App Store Connect key must exist on disk: @electron/notarize reads
      # APPLE_API_KEY as a path, not as the key material.
      - name: Write App Store Connect API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          # Checked here rather than in the step's `if`: the secrets context is
          # not available in step-level conditions.
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "No APPLE_API_KEY_B64 secret — the build will not be notarized."
            exit 0
          fi
          keydir="$RUNNER_TEMP/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$keydir/AuthKey.p8"
          echo "APPLE_API_KEY=$keydir/AuthKey.p8" >> "$GITHUB_ENV"

      # Signing credentials are scoped to macOS on purpose: CSC_LINK is not
      # platform-specific, so leaking it to the Windows runner would make
      # electron-builder try to sign the installer with a Developer ID cert.
      # Missing secrets resolve to '', which electron-builder treats as absent —
      # the build then still succeeds, unsigned.
      - run: npm run ${{ matrix.script }} -- --publish never ${{ matrix.args }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      # Defense in depth: assert the packaged app contains the target-arch
      # ffmpeg, not whatever the host runner happened to install at npm ci.
      - name: Verify packaged FFmpeg architecture
        if: matrix.ffmpeg_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 2 -name 'Ambora.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::Ambora.app not found; cannot verify ffmpeg architecture"
            exit 1
          fi
          ffmpeg="$app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          if [ ! -f "$ffmpeg" ]; then
            echo "::error::Packaged ffmpeg not found at $ffmpeg"
            exit 1
          fi
          info="$(file -b "$ffmpeg")"
          echo "Packaged ffmpeg: $info"
          case "${{ matrix.ffmpeg_arch }}" in
            arm64)
              echo "$info" | grep -q 'arm64' || {
                echo "::error::Packaged ffmpeg is not arm64: $info"
                exit 1
              }
              ;;
            x64)
              echo "$info" | grep -Eq 'x86_64|i386' || {
                echo "::error::Packaged ffmpeg is not x86_64: $info"
                exit 1
              }
              ;;
          esac

      # Gates the release. When the signing secrets are configured, a build that
      # failed to sign or notarize must fail here — otherwise the publish job
      # would flip the draft to public and ship an app Gatekeeper blocks. With no
      # secrets configured (forks) this only reports.
      - name: Verify macOS signature and notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          EXPECT_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          app="$(find dist -maxdepth 2 -name 'Ambora.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::Ambora.app not found; cannot verify the build"
            exit 1
          fi
          echo "Inspecting $app"

          info="$(codesign --display --verbose=2 "$app" 2>&1 || true)"
          echo "$info" | grep -E '^(Authority|TeamIdentifier|Signature|CodeDirectory)' || true

          signed=false
          echo "$info" | grep -q '^Authority=Developer ID Application' && signed=true

          # Gatekeeper accepts an app only once it is notarized AND stapled, so
          # this is what separates "signed" from "actually installable".
          notarized=false
          spctl --assess --type execute --verbose=4 "$app" 2>&1 && notarized=true

          # APPLE_API_KEY is exported by the earlier step only when the key secret
          # was present, so it doubles as "notarization was expected".
          expect_notarized=false
          [ -n "${APPLE_API_KEY:-}" ] && expect_notarized=true

          echo "signed=$signed (expected=$EXPECT_SIGNED)  notarized=$notarized (expected=$expect_notarized)"

          failed=false
          if [ "$EXPECT_SIGNED" = "true" ] && [ "$signed" != "true" ]; then
            echo "::error::CSC_LINK is set but the app carries no Developer ID signature — check CSC_LINK/CSC_KEY_PASSWORD."
            failed=true
          fi
          if [ "$expect_notarized" = "true" ] && [ "$notarized" != "true" ]; then
            echo "::error::Apple API credentials are set but Gatekeeper rejected the app — notarization did not succeed."
            failed=true
          fi
          if [ "$failed" = "true" ]; then
            exit 1
          fi

          if [ "$signed" = "true" ] && [ "$notarized" = "true" ]; then
            echo "::notice::Signed and notarized — Gatekeeper accepted the app"
          else
            echo "::warning::Unsigned or unnotarized build (no Apple secrets configured)"
          fi

      - name: Upload artifacts to release
        shell: bash
        run: |
          shopt -s nullglob
          # Exclude names every matrix cell emits identically — concurrent
          # uploads of the same ReleaseAsset name race even with --clobber and
          # fail the job after the real installers may already have been built
          # (see v0.7.2 macos-arm64: builder-debug.yml → HTTP 422).
          candidates=(dist/*.{dmg,zip,exe,blockmap,AppImage,deb,rpm,yml,yaml})
          files=()
          for f in "${candidates[@]}"; do
            case "$(basename "$f")" in
              builder-debug.yml|builder-effective-config.yaml) continue ;;
            esac
            files+=("$f")
          done
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" \
              --repo ${{ github.repository }} --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
