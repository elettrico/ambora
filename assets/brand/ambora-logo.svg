<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Gradient for the left arc (Channel A - fading out) -->
    <linearGradient id="arcA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B93F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6659D9" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Gradient for the right arc (Channel B - fading in) -->
    <linearGradient id="arcB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#95A8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B93F5" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow for the overlap/crossfade zone -->
    <radialGradient id="crossfadeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95A8F8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#95A8F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle background radial -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0C0C0E"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- LOGOMARK: Two overlapping arcs = crossfade -->
  <g transform="translate(400, 175)">

    <!-- Soft glow behind the mark -->
    <ellipse cx="0" cy="0" rx="90" ry="90" fill="url(#crossfadeGlow)"/>

    <!-- Channel A: Left arc cluster (3 concentric arcs) -->
    <g opacity="0.85">
      <path d="M -18,58 A 68,68 0 0,1 -18,-58" fill="none" stroke="url(#arcA)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M -14,44 A 52,52 0 0,1 -14,-44" fill="none" stroke="url(#arcA)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
      <path d="M -10,28 A 34,34 0 0,1 -10,-28" fill="none" stroke="url(#arcA)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Channel B: Right arc cluster (3 concentric arcs) -->
    <g opacity="0.85">
      <path d="M 10,28 A 34,34 0 0,0 10,-28" fill="none" stroke="url(#arcB)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M 14,44 A 52,52 0 0,0 14,-44" fill="none" stroke="url(#arcB)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
      <path d="M 18,58 A 68,68 0 0,0 18,-58" fill="none" stroke="url(#arcB)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#7B93F5" opacity="0.15"/>
    <circle cx="0" cy="0" r="4" fill="#EAEAED" opacity="0.9"/>

  </g>

  <!-- WORDMARK: "AMBORA" -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" text-anchor="middle"
      font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="44" font-weight="300" letter-spacing="0.32em" fill="#EAEAED" opacity="0.95"
    >AMBORA</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" text-anchor="middle"
      font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="12" font-weight="400" letter-spacing="0.25em" fill="#9494A0" opacity="0.7"
    >ATMOSPHERIC MUSIC FOR YOUR TABLE</text>
  </g>

  <!-- Subtle bottom accent line -->
  <line x1="355" y1="370" x2="445" y2="370" stroke="#7B93F5" stroke-width="1" opacity="0.25"/>
</svg>
